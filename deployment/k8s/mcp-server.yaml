# Kubernetes RBAC & Workload Manifest for Agent SPIFFE Identity Impersonation
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-investigator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-investigator
  namespace: k8s-investigator
---
# 1. MCP Server Impersonator Role:
# Allows the MCP Server ServiceAccount ONLY to impersonate users/groups/serviceaccounts
# (specifically the verified Agent SPIFFE ID), NOT to read cluster resources directly.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-impersonator-role
rules:
  - apiGroups: [""]
    resources: ["users", "groups", "serviceaccounts"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-impersonator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-mcp-impersonator-role
subjects:
  - kind: ServiceAccount
    name: k8s-investigator
    namespace: k8s-investigator
---
# 2. Read-Only Investigation ClusterRole:
# Grants strictly read-only (get, list, watch) permissions across cluster resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-investigation-cluster-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
      - namespaces
      - services
      - configmaps
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
---
# 3. Bind Read-Only ClusterRole Directly to the Agent's Google Cloud SPIFFE Identity:
# Ensures GKE Audit Logs attribute every get/list/watch request to the specific
# AI agent's SPIFFE ID rather than the shared MCP service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-investigator-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-investigation-cluster-role
subjects:
  - kind: User
    name: spiffe://agents.global.proj-188361172024.system.id.goog/resources/aiplatform/projects/188361172024/locations/us-east1/reasoningEngines/2369380487647985664
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: agents.global.proj-188361172024.system.id.goog/resources/aiplatform/projects/188361172024/locations/us-east1/reasoningEngines/2369380487647985664
    apiGroup: rbac.authorization.k8s.io
